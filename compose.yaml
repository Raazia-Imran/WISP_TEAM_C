services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17
    profiles: ["database"]
    environment:
      POSTGRES_DB: wisp
      POSTGRES_USER: wisp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisp -d wisp"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
